<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"></head><body>
<title>Family Office Watchlist</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=Manrope:wght@400;500;600;700;800&amp;family=Roboto+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
/* Layout: private-bank terminal. Dark ink-navy desk, brass accents, a live-looking ticker tape, a sticky section bar, then summary table → grouped cards → glowing risk matrix → rebased comparison → event timeline. Ticker pages open as a full view with a hero price and charted history. */
:root {
  color-scheme: dark;
  --bg:#080e19; --bg-2:#0b1322; --surface:#0f1828; --surface-2:#131f33; --surface-3:#1a2840;
  --line:#1f2d45; --line-strong:#2d4061;
  --fg:#eaeef6; --fg-2:#b7c2d6; --fg-muted:#8592ab;
  --accent:#d2ab5f; --accent-strong:#ecc87f; --accent-ink:#1b1407; --accent-soft:#2a2413; --accent-line:#5c4a25;
  --glow:rgba(210,171,95,.13); --glow-2:rgba(57,135,229,.10);
  --primary-bg:#d2ab5f; --primary-fg:#1b1407; --primary-hover:#ecc87f; --primary-disabled:#a38c5a;
  --gain:#45d29e; --gain-soft:#0e2a21; --loss:#ff7586; --loss-soft:#33141d;
  --critical:#ff8a8a; --critical-bg:#3a1219; --critical-line:#7a2a33; --critical-glow:rgba(255,92,92,.30);
  --warning:#f5c15c; --warning-bg:#33270c; --warning-line:#6d5419; --warning-glow:rgba(245,193,92,.24);
  --good:#4fd8a4; --good-bg:#0c2c22; --good-line:#1d5e47; --good-glow:rgba(79,216,164,.22);
  --chart-label:#eaeef6; --chart-grid:#1a273d; --series-muted:#33445f; --c1:#3987e5; --c2:#d95926; --c3:#199e70;
  --ma50:#3987e5; --ma200:#9085e9; --bench:#8592ab;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 18px 40px -24px rgba(0,0,0,.8);
  --font-display:'DM Serif Display',Georgia,'Times New Roman',serif;
  --font-ui:'Manrope',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --radius:10px; --radius-sm:6px;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg:#eef1f6; --bg-2:#e7ecf3; --surface:#ffffff; --surface-2:#f6f8fb; --surface-3:#e9eef5;
  --line:#d8dfea; --line-strong:#b8c3d5;
  --fg:#0c1527; --fg-2:#34425e; --fg-muted:#5a6782;
  --accent:#8a6820; --accent-strong:#6d5117; --accent-ink:#ffffff; --accent-soft:#f4ecd9; --accent-line:#d7c18f;
  --glow:rgba(138,104,32,.08); --glow-2:rgba(42,120,214,.06);
  --primary-bg:#14213a; --primary-fg:#f3e3bd; --primary-hover:#22345a; --primary-disabled:#3d4a63;
  --gain:#0b7a54; --gain-soft:#e0f4ec; --loss:#bf263e; --loss-soft:#fbe6ea;
  --critical:#b0213a; --critical-bg:#fde7ea; --critical-line:#f0b3bd; --critical-glow:rgba(176,33,58,.12);
  --warning:#875800; --warning-bg:#fff1d2; --warning-line:#ecd096; --warning-glow:rgba(135,88,0,.10);
  --good:#0d6c4b; --good-bg:#ddf4ea; --good-line:#a5dcc6; --good-glow:rgba(13,108,75,.10);
  --chart-label:#34425e; --chart-grid:#e4e9f1; --series-muted:#c4cddb; --c1:#2a78d6; --c2:#eb6834; --c3:#169e6e;
  --ma50:#2a78d6; --ma200:#6250d6; --bench:#5a6782;
  --shadow:0 1px 2px rgba(12,21,39,.05), 0 12px 32px -22px rgba(12,21,39,.35);
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 var(--font-ui);font-variant-numeric:tabular-nums;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
body{background-image:radial-gradient(1200px 520px at 12% -10%,var(--glow),transparent 60%),radial-gradient(900px 480px at 100% 0%,var(--glow-2),transparent 55%);background-repeat:no-repeat}

button,input,select{font:inherit;color:var(--fg)}
button,select,input{background:var(--surface-2);border:1px solid var(--line-strong);border-radius:var(--radius-sm)}
button,select{min-height:36px;padding:6px 12px;font-weight:600;font-size:13px}
button{cursor:pointer;transition:background .15s,border-color .15s,color .15s}
button:hover{background:var(--surface-3);border-color:var(--accent-line)}
button:disabled{cursor:wait;opacity:.7}
button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong)}
a{color:var(--accent-strong);text-decoration-color:var(--accent-line);text-underline-offset:3px}
a:hover{text-decoration-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
:focus:not(:focus-visible),[tabindex="-1"]:focus{outline:none}
input{min-height:46px;padding:10px 14px;width:100%;font-size:15px}
input:focus{border-color:var(--accent)}

h1,h2,h3,h4{line-height:1.2;margin:0 0 10px;text-wrap:balance}
h1,h2{font-family:var(--font-display);font-weight:400;letter-spacing:.005em}
h1{font-size:30px}
h2{font-size:26px}
h3{font-family:var(--font-ui);font-size:15px;font-weight:700;letter-spacing:.01em}
h4{font-family:var(--font-ui);font-size:14px;font-weight:700}
p{margin:6px 0 12px}
ul,ol{padding-left:20px}
li{margin-block:5px}
small,.small{font-size:12px}
.muted{color:var(--fg-muted)}
.num,.ticker{font-family:var(--font-mono)}
.ticker{font-weight:600;letter-spacing:.02em}
a.ticker{text-decoration:none;color:var(--accent-strong)}
a.ticker:hover{text-decoration:underline}
.positive{color:var(--gain)}
.negative{color:var(--loss)}
.eyebrow{font:700 11px/1 var(--font-ui);letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}

.outer{max-width:1480px;margin-inline:auto;padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px));padding-block:22px 64px}

/* Lock screen */
.lock{max-width:460px;margin:14vh auto 0;background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--line-strong);border-radius:16px;padding:36px 34px 30px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.lock::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.lock-mark{width:44px;height:44px;border:1px solid var(--accent-line);border-radius:50%;display:grid;place-items:center;margin-bottom:18px;background:var(--accent-soft)}
.lock-mark svg{width:20px;height:20px}
.lock-mark svg *{stroke:var(--accent-strong)}
.lock h1{font-size:32px;margin:8px 0 22px}
.lock label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-muted)}
.password-row{display:flex;gap:8px;margin:8px 0 16px}
.password-row input{min-width:0}
#show-passphrase{white-space:nowrap;min-width:68px;flex-shrink:0}
.primary{background:var(--primary-bg);color:var(--primary-fg);border-color:var(--primary-bg);min-height:46px;padding-inline:22px;font-weight:800;letter-spacing:.02em;width:100%}
.primary:hover,.primary:focus-visible{background:var(--primary-hover);color:var(--primary-fg);border-color:var(--primary-hover)}
.primary:disabled{background:var(--primary-disabled);color:var(--primary-fg);border-color:var(--primary-disabled);opacity:1}
.lock-note{display:flex;gap:8px;align-items:center;margin-top:16px;font-size:12px;color:var(--fg-muted)}
.error{color:var(--critical)}

/* Masthead */
.masthead{display:flex;flex-direction:column;gap:16px;margin-bottom:6px}
.mast-top{display:flex;gap:16px 24px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap}
.brand{min-width:0}
.brand h1{font-size:38px;margin:8px 0 0}
.mast-right{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap}
.status{display:inline-flex;gap:8px;align-items:center;padding:6px 12px;border:1px solid var(--line-strong);border-radius:999px;font-size:12px;color:var(--fg-2);background:var(--surface)}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--gain);box-shadow:0 0 0 3px var(--gain-soft)}
.status.stale .dot{background:var(--warning);box-shadow:0 0 0 3px var(--warning-bg)}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.controls label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-muted)}
.disclaimer{font-size:12px;color:var(--fg-muted);margin:0}

/* Ticker tape */
.tape{display:flex;gap:0;overflow-x:auto;border-block:1px solid var(--line);background:linear-gradient(180deg,var(--surface),var(--bg-2));scrollbar-width:thin;mask-image:linear-gradient(90deg,transparent,black 24px,black calc(100% - 24px),transparent)}
.tape-item{display:flex;gap:10px;align-items:baseline;padding:11px 18px;border-right:1px solid var(--line);text-decoration:none;color:var(--fg);white-space:nowrap;flex:0 0 auto}
.tape-item:hover{background:var(--surface-2)}
.tape-item .ticker{color:var(--accent-strong);font-size:12px}
.tape-item .px{font:600 13px var(--font-mono)}
.tape-item .chg{font:500 12px var(--font-mono)}

/* Section bar */
.jump{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;display:flex;gap:4px;overflow-x:auto;padding:10px 0;margin-block:6px 4px;background:var(--bg);border-bottom:1px solid var(--line)}
.jump button{background:transparent;border-color:transparent;color:var(--fg-2);font-size:12px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.jump button:hover{color:var(--accent-strong);background:var(--surface-2)}

/* Sections and panels */
.section{padding-block:30px 8px;scroll-margin-top:64px}
.section>h2{display:flex;align-items:baseline;gap:12px;padding-bottom:12px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.section>h2::before{content:"";width:22px;height:2px;background:var(--accent);flex:0 0 auto;transform:translateY(-7px)}
#dashboard-title{font-size:26px;margin-top:26px;display:flex;align-items:baseline;gap:12px}
#dashboard-title::before{content:"";width:22px;height:2px;background:var(--accent);transform:translateY(-7px)}
.section-anchor{scroll-margin-top:64px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.toolbar,.between,.nav-row{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.toolbar{margin-bottom:16px}
.rule{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:var(--radius-sm);padding:10px 14px;color:var(--fg-2)}
.rule strong{color:var(--accent-strong)}

/* Board */
.group{margin-block:22px 30px}
.group-intro{display:flex;gap:6px 14px;align-items:baseline;flex-wrap:wrap;margin-bottom:14px}
.group-intro h3{font-family:var(--font-display);font-weight:400;font-size:21px;margin:0}
.group-intro p{margin:0;width:100%}
.board-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px}
.board-card{width:100%;max-width:420px;position:relative;background:linear-gradient(180deg,var(--surface-2),var(--surface) 46%);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 16px;min-width:0;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;transition:border-color .15s,transform .15s}
.board-card:hover{border-color:var(--accent-line)}
.board-card h4{font-size:20px;margin:0}
.board-card h4 a.ticker{font-size:20px}
.board-card .name{font-weight:700;color:var(--fg-2);font-size:13px}
.board-card .tag{color:var(--fg-muted);font-size:12px;margin:2px 0 6px;min-height:0}
.card-price{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-block:8px 2px}
.card-price strong{font:600 26px/1.1 var(--font-mono);letter-spacing:-.01em}
.card-price span{font-size:11px;color:var(--fg-muted)}
.changes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}
.changes>div{min-width:0;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:6px 8px}
.changes .label{font-size:10px;line-height:1.3;letter-spacing:.05em;text-transform:uppercase;display:block;color:var(--fg-muted)}
.changes .num{font-size:12.5px;font-weight:600;white-space:nowrap}
.range{margin-block:12px 4px}
.range-labels{display:flex;justify-content:space-between;gap:8px;font-size:10.5px;letter-spacing:.04em;color:var(--fg-muted)}
.range-track{position:relative;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--loss-soft),var(--surface-3),var(--gain-soft));margin-block:8px}
.range-marker{position:absolute;top:-5px;width:4px;height:14px;border-radius:2px;background:var(--accent-strong);box-shadow:0 0 0 3px var(--accent-soft);transform:translateX(-50%)}
.spark{width:100%;height:62px;display:block;margin-top:8px}
.score-strip{display:flex;gap:6px;flex-wrap:wrap;font-size:11.5px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.score-strip span{display:inline-flex;gap:6px;align-items:baseline;padding:3px 9px;border-radius:999px;background:var(--surface-3);color:var(--fg-2)}
.score-strip strong{font-family:var(--font-mono);color:var(--fg)}
.trigger{margin:10px 0 0;color:var(--fg-2)}
.event-line{margin-top:10px;padding:10px 12px;font-size:12px;color:var(--fg-2);background:var(--bg-2);border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:var(--radius-sm)}
.event-line strong{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;border:1px solid transparent}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.high,.heat-H{color:var(--critical);background:var(--critical-bg);border-color:var(--critical-line)}
.elevated,.heat-M,.stale{color:var(--warning);background:var(--warning-bg);border-color:var(--warning-line)}
.moderate,.heat-L{color:var(--good);background:var(--good-bg);border-color:var(--good-line)}
.heat-na{color:var(--fg-muted);background:var(--surface-3);border-color:var(--line)}

/* Tables */
.table-scroll{overflow-x:auto;max-width:100%;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);overscroll-behavior-x:contain}
table{width:100%;border-collapse:collapse;text-align:left}
th,td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
thead th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-muted);background:var(--surface-2);font-weight:700;white-space:nowrap}
tbody tr:last-child>*{border-bottom:0}
tbody tr:hover>*{background:var(--surface-2)}
.glance{min-width:960px;font-size:13px}
.glance td,.glance th{white-space:nowrap;vertical-align:middle}
.glance tbody th a.ticker{font-size:14px}
.glance .spark{width:120px;height:30px;margin:0}
.dense{min-width:1430px;font-size:12px}
.dense td:first-child{min-width:190px}
.dense td{min-width:80px}
.dense .dense-info{min-width:260px;max-width:330px}
.dense .spark{width:130px;height:45px}
.dense .range{width:150px}

/* Risk matrix */
.matrix{min-width:1080px}
.matrix th:first-child{min-width:110px;position:sticky;left:0;z-index:1;background:var(--surface)}
.matrix thead th:first-child{background:var(--surface-2)}
.matrix thead th{min-width:96px;text-align:center;vertical-align:bottom}
.matrix thead th:first-child{text-align:left}
.matrix thead span{font:600 10px/1.3 var(--font-ui);letter-spacing:.02em;text-transform:none;display:block;margin-top:4px;color:var(--fg-2)}
.matrix td{padding:5px}
.matrix tbody th{vertical-align:middle}
.heat{width:100%;min-height:42px;font:700 14px var(--font-mono);border-radius:var(--radius-sm);border:1px solid var(--line);transition:transform .12s, box-shadow .12s}
.heat.heat-H{box-shadow:inset 0 0 0 1px var(--critical-line),0 0 18px -4px var(--critical-glow)}
.heat.heat-M{box-shadow:inset 0 0 0 1px var(--warning-line),0 0 16px -6px var(--warning-glow)}
.heat.heat-L{box-shadow:inset 0 0 0 1px var(--good-line),0 0 14px -6px var(--good-glow)}
.heat:hover,.heat:focus-visible{transform:translateY(-1px);filter:brightness(1.12)}
.heat.high,.heat.elevated,.heat.moderate{font:800 11px var(--font-ui);letter-spacing:.08em;text-transform:uppercase}
.matrix .separate>*{border-top:2px dashed var(--line-strong)}
.risk-panel{min-height:84px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--radius);padding:16px 18px;margin-top:14px;box-shadow:var(--shadow)}
.risk-panel strong{color:var(--fg)}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-block:12px}
.legend span{padding:3px 10px;border-radius:999px;border:1px solid;font-weight:700;font-size:11px}
.matrix-note{max-width:90ch;margin-top:12px}
.remarks-table th,.remarks-table td:nth-child(2){white-space:nowrap}
.remarks-table td:last-child{min-width:18rem;color:var(--fg-2)}
.research-text{max-width:105ch;color:var(--fg-2)}
.research-text strong{color:var(--fg)}
.research-text table{min-width:650px}
.research-text .table-scroll{margin-block:12px}
.research-text li{margin-block:7px}
.research-text h3{color:var(--fg);margin-top:20px}

/* Charts */
.chart-frame{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 8px 4px;margin-block:12px;min-width:0;box-shadow:var(--shadow)}
.chart-frame svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chart-axis{font:11px var(--font-mono);fill:var(--fg-muted)}
.chart-grid{stroke:var(--chart-grid);fill:none;stroke-width:1}
.price-line{stroke:var(--accent-strong);fill:none;stroke-width:2;stroke-linejoin:round}
.ma50{stroke:var(--ma50);fill:none;stroke-width:1.5;opacity:.9}
.ma200{stroke:var(--ma200);fill:none;stroke-width:1.5;opacity:.9}
.benchmark{stroke:var(--bench);fill:none;stroke-width:1.5;stroke-dasharray:6 5}
.series{stroke:var(--series-muted);fill:none;stroke-width:1.4;stroke-linejoin:round;transition:opacity .15s,stroke-width .15s}
.series.pinned{stroke:var(--series);stroke-width:2.2}
.series.dashed{stroke:var(--bench);stroke-dasharray:6 5}
.series.faded{opacity:.18}
.series.highlight{stroke-width:3;opacity:1}
.series.muted.highlight,.series.dashed.highlight{stroke:var(--accent-strong)}
.end-label{font:700 11px var(--font-mono);fill:var(--chart-label)}
.end-leader{stroke:var(--series);stroke-width:3}
.spark-line{fill:none;stroke:var(--accent-strong);stroke-width:1.8;stroke-linejoin:round}
.spark-line.up{stroke:var(--gain)}
.spark-line.down{stroke:var(--loss)}
.spark-area{fill:var(--accent);opacity:.12;stroke:none}
.spark-area.up{fill:var(--gain)}
.spark-area.down{fill:var(--loss)}
.spark-dot{fill:var(--accent-strong);stroke:var(--surface);stroke-width:2}
.spark-dot.up{fill:var(--gain)}
.spark-dot.down{fill:var(--loss)}
.crosshair{stroke:var(--fg-muted);fill:none;stroke-dasharray:3 3}
.cross-dot{fill:var(--accent-strong);stroke:var(--surface);stroke-width:2}
.reference{stroke:var(--accent);fill:none;stroke-dasharray:2 4;opacity:.8}
.reference-text{fill:var(--accent);font:11px var(--font-mono)}
.chart-readout{min-height:30px;font:12px var(--font-mono);color:var(--fg-2);padding:6px 8px}
.chart-legend{display:flex;gap:8px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:8px;padding:4px 6px 4px 10px;min-width:0;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.legend-item.is-pinned{border-color:var(--series);background:var(--surface-2)}
.legend-item button{min-height:26px;padding:2px 10px;font-size:11px;border-radius:999px}
.legend-item:focus-within,.legend-item:hover{border-color:var(--accent-line)}
.swatch{display:inline-block;width:14px;height:3px;border-radius:2px;background:var(--series-muted)}
.is-pinned .swatch{background:var(--series)}
.swatch.dashed{background:repeating-linear-gradient(90deg,var(--bench) 0 4px,transparent 4px 7px)}
.legend-item a{font-size:12px}
.axis-key{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--fg-muted)}
.axis-key .key-price{color:var(--accent-strong)}
.axis-key .key-50{color:var(--ma50)}
.axis-key .key-200{color:var(--ma200)}
.axis-key .key-bench{color:var(--bench)}

/* Calendar as a timeline */
.event-table{min-width:760px}
.event-table th:first-child{min-width:170px;border-left:2px solid var(--accent-line)}
.event-table tbody th{font:600 14px var(--font-ui);color:var(--fg)}
.event-table .time{display:inline-block;font:600 11px var(--font-mono);color:var(--accent-strong);background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:999px;padding:1px 8px;margin-top:6px}
.ticker-links{display:flex;flex-wrap:wrap;gap:4px 8px}
.ticker-links a.ticker{font-size:12px;padding:1px 7px;border:1px solid var(--line-strong);border-radius:4px;background:var(--surface-2)}
.event-source{font-size:11px;color:var(--fg-muted);display:block;margin-top:5px}
details{margin-block:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:12px 16px}
summary{cursor:pointer;font-weight:700;color:var(--fg-2)}
summary:hover{color:var(--accent-strong)}
details[open]>summary{margin-bottom:12px}

/* Ticker detail */
.detail-head{position:relative;padding:26px 26px 22px;margin-top:6px;border:1px solid var(--line);border-radius:14px;background:radial-gradient(700px 260px at 0% 0%,var(--glow),transparent 70%),linear-gradient(180deg,var(--surface-2),var(--surface));box-shadow:var(--shadow);overflow:hidden}
.detail-head::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,var(--accent),transparent 70%)}
.detail-head h1{font-size:40px;margin:0;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline}
.detail-head h1 .ticker{font:600 34px var(--font-mono);color:var(--accent-strong)}
.detail-head .name{font:400 30px var(--font-display);color:var(--fg)}
.detail-head .changes{max-width:520px;margin-top:14px}
.detail-price{font:600 44px/1.1 var(--font-mono);margin-top:18px;letter-spacing:-.02em}
.detail-price small{font:500 13px var(--font-ui);letter-spacing:0}
.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}
.detail-grid>*{min-width:0}
.stat-table{min-width:460px}
.score-row{display:grid;grid-template-columns:150px minmax(60px,1fr) 38px;gap:12px;align-items:center;margin-block:12px}
.score-row span{font-size:12.5px;color:var(--fg-2)}
.score-track{height:6px;border-radius:6px;background:var(--surface-3);overflow:hidden}
.score-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent-line),var(--accent-strong))}
.risk-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.risk-item{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;background:var(--surface)}
.risk-item strong{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.risk-item p{margin:8px 0 0;color:var(--fg-2)}
.definition{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px 14px;margin:0}
.definition dt{color:var(--fg-muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.definition dd{margin:0}
.nav-row{padding-block:16px 6px}
.nav-row a{text-decoration:none;font-weight:700;font-size:13px}
.nav-row .controls a{padding:6px 12px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface)}
.footer{font-size:12px;color:var(--fg-muted);padding-block:18px}
.skip{position:absolute;left:-9999px}
.skip:focus{position:static}

@media(max-width:700px){
  h1{font-size:26px} h2{font-size:22px}
  .brand h1{font-size:30px}
  .outer{padding-block:16px 40px}
  .lock{padding:26px 22px;margin-top:8vh}
  .detail-grid,.risk-list{grid-template-columns:minmax(0,1fr)}
  .board-grid{grid-template-columns:minmax(0,1fr)}
  .mast-top{align-items:flex-start}
  .score-row{grid-template-columns:110px minmax(60px,1fr) 34px}
  .chart-frame{padding:6px 2px 2px}
  .definition{grid-template-columns:100px minmax(0,1fr)}
  .detail-head{padding:20px 18px}
  .detail-head h1 .ticker{font-size:26px}
  .detail-head .name{font-size:22px}
  .detail-price{font-size:34px}
  .changes{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>

      if(line.startsWith('|')) {
        closeList();
        const rows=[];
        while(i<lines.length && lines[i].trim().startsWith('|')) {

        else comparisonHidden.add(t);
      }else if(comparisonPinned.includes(t))comparisonPinned=comparisonPinned.filter(x=>x!==t);
      else comparisonPinned=[...comparisonPinned,t].slice(-3);
      comparison();
      const replacement=[...document.querySelectorAll('[data-series-toggle]')].find(x=>x.dataset.seriesToggle===t);
      replacement?.focus();
    }
    if(b.dataset.detailWindow){
      detailWindow=Number(b.dataset.detailWindow);
      crosshairIndex=null;
      document.querySelectorAll('[data-detail-window]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
      priceChart();
    }
    if(b.id==='overlay-benchmark'){
      overlayBenchmark=!overlayBenchmark;
      b.setAttribute('aria-pressed',String(overlayBenchmark));
      priceChart();
    }
  });
  document.addEventListener('change',e=>{
    if(!D)return;
    if(e.target.id==='board-sort'){
      sortMode=e.target.value;
      renderBoard();
    }
    if(e.target.id==='theme-select'){
      if(e.target.value==='dark')document.documentElement.removeAttribute('data-theme');
      else document.documentElement.dataset.theme=e.target.value;
    }
  });
  document.addEventListener('focusin',e=>{
    if(!D)return;
    const cell=e.target.closest('[data-risk-ticker]');
    if(cell)riskRemark(cell);
    const legend=e.target.closest('[data-highlight]');
    if(legend)highlightSeries(legend.dataset.highlight);
  });
  document.addEventListener('focusout',e=>{
    if(e.target.closest('[data-highlight]')&&!e.relatedTarget?.closest('[data-highlight]'))highlightSeries(null);
  });
  document.addEventListener('pointerover',e=>{
    const item=e.target.closest('[data-highlight], [data-series]');
    if(D&&item)highlightSeries(item.dataset.highlight||item.dataset.series);
  });
  document.addEventListener('pointerout',e=>{
    if(D&&e.target.closest('[data-highlight], [data-series]')&&!e.relatedTarget?.closest('[data-highlight], [data-series]'))highlightSeries(null);
  });
  window.addEventListener('hashchange',()=>route(true));
  // Plain mode exists only in the optional local review output, never the deliverable.
  if(envelope.plain){
    openDashboard(JSON.parse(new TextDecoder().decode(decode64(envelope.plain))));
  }
})();
</script>

</body></html>
