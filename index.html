<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"></head><body>
<title>Family Office Watchlist</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,500;100,650;100,750&amp;family=JetBrains+Mono:wght@400;500&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
/* Layout: a compact research sheet, grouped board, scroll-contained tables and a separate ticker detail view. */
:root {
  color-scheme: light;
  
  --bg:#f0f3f8;
   --surface:#ffffff;
   --surface-alt:#e7edf5;
   --fg:#17263b;
   --fg-muted:#4b5e76;
   --line:#bac7d7;
  
  --primary-bg:#164db8; --primary-fg:#ffffff; --primary-hover:#123e94; --primary-disabled:#526b97;
  --accent:#164db8;
   --accent-soft:#e1eaff;
   --critical:#9d263f;
   --critical-bg:#fbe4e9;
   --warning:#825100;
   --warning-bg:#fff0cf;
   --good:#17664e;
   --good-bg:#dcf3e9;
  
  --gain:#12614f;
   --loss:#a52b49;
   --chart-grid:#d7e0ec;
   --scrim:#f0f3f8;
  
  --s0:#2159bd;
   --s1:#a13757;
   --s2:#087569;
   --s3:#7a4bba;
   --s4:#97600b;
   --s5:#136c99;
   --s6:#a14216;
   --s7:#6548a0;
   --s8:#437219;
   --s9:#a02685;
   --s10:#2d6570;
   --s11:#556178;
   --s12:#6a5669;
   --s13:#6b6549;
  
  --font-body:'Public Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  
  --font-head:'Archivo',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,monospace;
  
}

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#101b2b;
   --surface:#17253a;
   --surface-alt:#21334b;
   --fg:#e6edf8;
   --fg-muted:#a8bbd3;
   --line:#445b77;
  
  --primary-bg:#91b5ff; --primary-fg:#101b2b; --primary-hover:#b1caff; --primary-disabled:#8a9cb9;
  --accent:#91b5ff;
   --accent-soft:#233e68;
   --critical:#ffb3c2;
   --critical-bg:#59283a;
   --warning:#f4cf81;
   --warning-bg:#503e21;
   --good:#9be1c6;
   --good-bg:#1e493f;
  
  --gain:#8cddc1;
   --loss:#ffb0c3;
   --chart-grid:#30465f;
   --scrim:#101b2b;
  
  --s0:#94baff;
   --s1:#ff9fb9;
   --s2:#64dbc7;
   --s3:#c0a1ff;
   --s4:#edca76;
   --s5:#78c4f2;
   --s6:#ffb28b;
   --s7:#a7a4ff;
   --s8:#b4d78a;
   --s9:#ed9bde;
   --s10:#8ec8ce;
   --s11:#c5cfdf;
   --s12:#c7aebf;
   --s13:#d1c6a7;
  
  color-scheme:dark;
  
}
 }

:root[data-theme="dark"] {
  --bg:#101b2b;
   --surface:#17253a;
   --surface-alt:#21334b;
   --fg:#e6edf8;
   --fg-muted:#a8bbd3;
   --line:#445b77;
  
  --primary-bg:#91b5ff; --primary-fg:#101b2b; --primary-hover:#b1caff; --primary-disabled:#8a9cb9;
  --accent:#91b5ff;
   --accent-soft:#233e68;
   --critical:#ffb3c2;
   --critical-bg:#59283a;
   --warning:#f4cf81;
   --warning-bg:#503e21;
   --good:#9be1c6;
   --good-bg:#1e493f;
  
  --gain:#8cddc1;
   --loss:#ffb0c3;
   --chart-grid:#30465f;
   --scrim:#101b2b;
  
  --s0:#94baff;
   --s1:#ff9fb9;
   --s2:#64dbc7;
   --s3:#c0a1ff;
   --s4:#edca76;
   --s5:#78c4f2;
   --s6:#ffb28b;
   --s7:#a7a4ff;
   --s8:#b4d78a;
   --s9:#ed9bde;
   --s10:#8ec8ce;
   --s11:#c5cfdf;
   --s12:#c7aebf;
   --s13:#d1c6a7;
  
  color-scheme:dark;
  
}

*{box-sizing:border-box}
 [hidden]{display:none!important}
 body{margin:0;
  background:var(--bg);
  color:var(--fg);
  font:14px/1.55 var(--font-body);
  font-variant-numeric:tabular-nums;
  overflow-wrap:anywhere}

button,input,select{font:inherit;
  color:var(--fg)}
 button,select,input{background:var(--surface);
  border:1px solid var(--line);
  border-radius:3px}
 button,select{min-height:36px;
  padding:6px 11px}
 button{cursor:pointer}
 button:hover{background:var(--surface-alt)}
 button:disabled{cursor:wait;
  opacity:.7}
 button[aria-pressed="true"]{background:var(--accent-soft);
  border-color:var(--accent);
  color:var(--accent)}

a{color:var(--accent);
  text-underline-offset:3px}
 a:hover{text-decoration-thickness:2px}
 :focus-visible{outline:3px solid var(--accent);
  outline-offset:3px}
 input{min-height:42px;
  padding:8px 11px;
  width:100%}
 h1,h2,h3,h4{font-family:var(--font-head);
  line-height:1.2;
  margin:0 0 10px}
 h1{font-size:26px;
  font-weight:750}
 h2{font-size:21px;
  font-weight:650}
 h3{font-size:17px;
  font-weight:650}
 h4{font-size:14px}
 p{margin:7px 0 12px}
 ul,ol{padding-left:22px}
 li{margin-block:5px}
 small,.small{font-size:12px}
 .muted{color:var(--fg-muted)}
 .num,.ticker{font-family:var(--font-mono)}
 .ticker{font-weight:500}
 .positive{color:var(--gain)}
 .negative{color:var(--loss)}

.outer{max-width:1450px;
  margin-inline:auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:24px 56px}
 .lock{max-width:440px;
  margin:12vh auto 0;
  background:var(--surface);
  border:1px solid var(--line);
  padding:28px}
 .lock h1{margin-bottom:24px}
.password-row{display:flex;
  gap:8px;
  margin:6px 0 14px}
.password-row input{min-width:0}
.primary{background:var(--primary-bg);color:var(--primary-fg);border-color:var(--primary-bg)}
.primary:hover,.primary:focus-visible{background:var(--primary-hover);color:var(--primary-fg);border-color:var(--primary-hover)}
.primary:disabled{background:var(--primary-disabled);color:var(--primary-fg);border-color:var(--primary-disabled);opacity:1}
:focus:not(:focus-visible),[tabindex="-1"]:focus{outline:none}
#show-passphrase{white-space:nowrap;min-width:64px;flex-shrink:0}
 .error{color:var(--critical)}

.header{border-bottom:2px solid var(--line);
  padding-bottom:16px;
  margin-bottom:24px}
.header-top,.toolbar,.between,.nav-row{display:flex;
  gap:12px;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap}
.header-top>*{min-width:0}
.controls{display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap}
.controls label{font-size:12px;
  color:var(--fg-muted)}
.header-meta{display:flex;
  gap:12px;
  flex-wrap:wrap;
  align-items:center;
  margin-block:12px 8px}
.section{padding-block:18px 24px;
  border-bottom:1px solid var(--line)}
.toolbar{margin-bottom:18px}
.group{margin-block:20px}
.group-intro{margin-bottom:12px}
.board-grid{display:grid;
  grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),380px));
  gap:12px}
.board-card{max-width:420px;
  background:var(--surface);
  border:1px solid var(--line);
  padding:16px;
  min-width:0}
.board-card h4{font-size:19px;
  margin-bottom:5px}
.board-card .name{font-weight:600}
.board-card .tag{min-height:36px}
.card-price{display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:baseline;
  margin-block:12px 5px}
.card-price strong{font-size:21px}
.changes{display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:7px}
.changes>div{min-width:0}
.changes .label{font-size:11px;
  display:block;
  color:var(--fg-muted)}
.changes .num{font-size:12px;
  white-space:nowrap}
.range{margin-block:13px 7px}
.range-labels{display:flex;
  justify-content:space-between;
  gap:8px;
  font-size:11px;
  color:var(--fg-muted)}
.range-track{position:relative;
  height:5px;
  background:var(--surface-alt);
  margin-block:9px}
.range-marker{position:absolute;
  top:-4px;
  width:3px;
  height:13px;
  background:var(--accent);
  transform:translateX(-50%)}
.spark{width:100%;
  height:65px;
  display:block}
.score-strip{display:flex;
  gap:10px;
  flex-wrap:wrap;
  font-size:12px;
  border-top:1px solid var(--line);
  padding-top:9px;
  margin-top:5px}
.score-strip strong{font-family:var(--font-mono)}
.trigger{margin-top:12px}
.event-line{border-top:1px solid var(--line);
  padding-top:8px;
  font-size:12px}
.remarks-table th,.remarks-table td:nth-child(2){white-space:nowrap}
.remarks-table td:last-child{min-width:18rem}
.pill{display:inline-block;
  padding:2px 8px;
  border-radius:20px;
  font-size:12px;
  font-weight:600;
  white-space:nowrap}
.high,.heat-H{color:var(--critical);
  background:var(--critical-bg)}
.elevated,.heat-M,.stale{color:var(--warning);
  background:var(--warning-bg)}
.moderate,.heat-L{color:var(--good);
  background:var(--good-bg)}
.heat-na{color:var(--fg-muted);
  background:var(--surface-alt)}

.table-scroll{overflow-x:auto;
  max-width:100%;
  border:1px solid var(--line);
  background:var(--surface);
  overscroll-behavior-x:contain}
table{width:100%;
  border-collapse:collapse;
  text-align:left}
 th,td{padding:10px 12px;
  border-bottom:1px solid var(--line);
  vertical-align:top}
thead th{font-size:12px;
  color:var(--fg-muted);
  background:var(--surface-alt);
  font-weight:600}
tbody tr:last-child>*{border-bottom:0}
.glance{min-width:880px;font-size:12px}
.glance td,.glance th{white-space:nowrap}
.dense{min-width:1430px;
  font-size:12px}
.dense td:first-child{min-width:190px}
.dense td{min-width:80px}
.dense .dense-info{min-width:260px;
  max-width:330px}
.dense .spark{width:130px;
  height:45px}
.dense .range{width:150px}
.matrix{min-width:1080px}
.matrix th:first-child{min-width:110px}
.matrix thead th{min-width:105px}
.matrix thead span{font:10px/1.25 var(--font-body);
  display:block;
  margin-top:4px}
.matrix td{padding:5px}
.heat{width:100%;
  min-height:43px;
  font:500 14px var(--font-mono);
  border:1px solid var(--line)}
.matrix .separate>*{border-top:3px solid var(--line)}
.risk-panel{min-height:80px;
  background:var(--surface-alt);
  padding:14px;
  margin-top:12px;
  border:1px solid var(--line)}
.legend{display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-block:10px}
.legend span{padding:3px 8px}
.matrix-note{max-width:90ch;
  margin-top:10px}
.research-text{max-width:105ch}
.research-text table{min-width:650px}
.research-text .table-scroll{margin-block:12px}
.research-text li{margin-block:7px}

.chart-frame{background:var(--surface);
  border:1px solid var(--line);
  padding:8px;
  margin-block:12px;
  min-width:0}
.chart-frame svg{display:block;
  width:100%;
  height:auto;
  touch-action:pan-y}
.chart-axis{font:11px var(--font-mono);
  fill:var(--fg-muted)}
.chart-grid{stroke:var(--chart-grid);
  fill:none;
  stroke-width:1}
.price-line{stroke:var(--accent);
  fill:none;
  stroke-width:2}
.ma50{stroke:var(--s4);
  fill:none;
  stroke-width:1.6}
.ma200{stroke:var(--s3);
  fill:none;
  stroke-width:1.6}
.benchmark{stroke:var(--s8);
  fill:none;
  stroke-width:1.5;
  stroke-dasharray:7 5}
.series{stroke:var(--series);
  fill:none;
  stroke-width:1.8;
  transition:opacity .12s}
.series.dashed{stroke-dasharray:7 5}
.series.faded{opacity:.13}
.series.highlight{stroke-width:3.5}
.spark-line{fill:none;
  stroke:var(--accent);
  stroke-width:1.8}
.spark-area{fill:var(--accent);
  opacity:.1;
  stroke:none}
.spark-dot{fill:var(--accent);
  stroke:var(--surface);
  stroke-width:1.5}
.crosshair{stroke:var(--fg-muted);
  fill:none;
  stroke-dasharray:3 3}
.cross-dot{fill:var(--accent);
  stroke:var(--surface);
  stroke-width:2}
.reference{stroke:var(--warning);
  fill:none;
  stroke-dasharray:3 4}
.reference-text{fill:var(--warning);
  font:11px var(--font-mono)}
.chart-readout{min-height:28px;
  font:12px var(--font-mono);
  color:var(--fg-muted);
  padding:3px 6px}
.chart-legend{display:flex;
  gap:6px 12px;
  flex-wrap:wrap}
.legend-item{display:flex;
  align-items:center;
  gap:6px;
  padding:3px 0;
  min-width:0}
.legend-item button{min-height:30px;
  padding:3px 6px;
  font-size:11px}
.legend-item:focus-within,.legend-item:hover{background:var(--surface-alt)}
.swatch{display:inline-block;
  width:16px;
  height:3px;
  background:var(--series)}
.legend-item a{font-size:12px}
.axis-key{display:flex;
  gap:16px;
  flex-wrap:wrap;
  font-size:12px;
  color:var(--fg-muted)}
.axis-key .key-price{color:var(--accent)}
.axis-key .key-50{color:var(--s4)}
.axis-key .key-200{color:var(--s3)}
.axis-key .key-bench{color:var(--s8)}

.event-table{min-width:760px}
.event-table th:first-child{min-width:155px}
.event-table .time{display:block;
  font:11px var(--font-mono);
  color:var(--fg-muted);
  margin-top:4px}
.ticker-links{display:flex;
  flex-wrap:wrap;
  gap:4px 9px}
.event-source{font-size:11px;
  color:var(--fg-muted);
  display:block;
  margin-top:5px}
 details{margin-block:12px;
  border:1px solid var(--line);
  background:var(--surface);
  padding:12px}
summary{cursor:pointer;
  font-weight:600}
details[open]>summary{margin-bottom:10px}
.detail-head{padding-block:14px 18px;
  border-bottom:1px solid var(--line)}
.detail-head .changes{max-width:460px;
  margin-top:12px}
.detail-head .name{font:19px var(--font-head)}
.detail-price{font:24px var(--font-mono);
  margin-top:16px}
.detail-grid{display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:26px}
.detail-grid>*{min-width:0}
.stat-table{min-width:460px}
.score-row{display:grid;
  grid-template-columns:100px minmax(60px,150px) 35px;
  gap:10px;
  align-items:center;
  margin-block:10px}
.score-track{height:8px;
  background:var(--surface-alt)}
.score-fill{height:100%;
  background:var(--accent)}
.risk-list{display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px}
.risk-item{border:1px solid var(--line);
  padding:12px;
  background:var(--surface)}
.risk-item p{margin:8px 0 0}
.definition{display:grid;
  grid-template-columns:130px minmax(0,1fr);
  gap:8px;
  margin:0}
.definition dt{color:var(--fg-muted)}
.definition dd{margin:0}
.nav-row{padding-block:18px}
.rule{background:var(--surface-alt);
  padding:12px}
.footer{font-size:12px;
  color:var(--fg-muted);
  padding-block:18px}
.skip{position:absolute;
  left:-9999px}
.skip:focus{position:static}

@media(max-width:650px){h1{font-size:23px}
h2{font-size:19px}
.outer{padding-block:18px 35px}
.lock{padding:20px;
  margin-top:8vh}
.detail-grid{grid-template-columns:minmax(0,1fr)}
.risk-list{grid-template-columns:minmax(0,1fr)}
.board-grid{grid-template-columns:minmax(0,1fr)}
.header-top{align-items:flex-start}
.header-top h1{flex-basis:100%}
.score-row{grid-template-columns:90px minmax(60px,1fr) 35px}
.chart-frame{padding:2px}
.definition{grid-template-columns:100px minmax(0,1fr)}
.controls{gap:6px}
.section{padding-block:16px 20px}
}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;
  transition:none!important;
  animation:none!important}
}
</style>
<div class="outer" id="watchlist-root">
  <section class="lock" id="lock-screen" aria-labelledby="lock-title">
    <h1 id="lock-title">Family Office Watchlist</h1>
    <form id="unlock-form">
      <label for="passphrase">Passphrase</label>
      <div class="password-row"><input id="passphrase" name="passphrase" type="password" autocomplete="current-password" required><button type="button" id="show-passphrase" aria-controls="passphrase" aria-pressed="false">Show</button></div>
      <button type="submit" id="unlock-button" class="primary">Unlock</button>
      <p id="unlock-message" class="error small" role="status" aria-live="polite" hidden></p>
    </form>
    <p class="small muted">The dashboard content is encrypted.</p>
  </section>
  <div id="unlocked" hidden></div>
</div>
<script>

  function niceDomain(lo,hi){

      step=([1,2,...(hi>20&&power>=1?[]:[2.5]),5,10].find(n=>n>=unit)||10)*power;

  }
  function axes(width,height,domainX,domainY,log=false){
    const pad={l:62,r:18,t:22,b:34},ticks=[];
    let lo,hi,step=1;
    if(log){
      lo=Math.min(domainY[0],95);
      hi=Math.max(domainY[1],105);
      for(let v=2**Math.floor(Math.log2(lo/100))*100;v<=hi;v*=2)if(v>=lo)ticks.push(v);
    }else{
      ({lo,hi,step}=niceDomain(...domainY));
      for(let v=lo;v<=hi+step/10;v+=step)ticks.push(v);
    }
    const tx=v=>log?Math.log(v):v,
      x=v=>pad.l+(v-domainX[0])/(domainX[1]-domainX[0]||1)*(width-pad.l-pad.r),
      y=v=>height-pad.b-(tx(v)-tx(lo))/(tx(hi)-tx(lo)||1)*(height-pad.t-pad.b);

      const py=y(v),digits=log?Math.max(0,-Math.floor(Math.log10(v))):hi>20&&step>=1?0:Math.min(2,Math.max(0,-Math.floor(Math.log10(step))+(step/(10**Math.floor(Math.log10(step)))===2.5?1:0)));

    }).join('');

  function priceMetrics(t){
    const s=D.prices[t].stats;
    return table(['Computed from Yahoo daily data','Value'],[['Distance from 50-day SMA',s.distance50==null?'n/a':`${s.distance50>=0?'+':'−'}${fmt(Math.abs(s.distance50))}% (SMA ${fmt(s.sma50)})`],['Distance from 200-day SMA',s.distance200==null?'n/a':`${s.distance200>=0?'+':'−'}${fmt(Math.abs(s.distance200))}% (SMA ${fmt(s.sma200)})`],[`${s.range_label} low / high (closes)`,`${money(s,s.low)} / ${money(s,s.high)}`],['Drawdown from closing high',`${s.drawdown<0?'−':'+'}${fmt(Math.abs(s.drawdown))}%`],['20-day annualised volatility',`${fmt(s.volatility20)}%`],['Average daily dollar volume (20 days)',s.dollar_volume20==null?'n/a':`${esc(s.currency)} ${fmt(s.dollar_volume20/1e6)}m`]],rich,'stat-table');
  }
  function detail(t){
    const c=byTicker[t],s=D.prices[t].stats,group=groupFor(t);
    return `<div class="nav-row"><a href="#" data-back>← Back to dashboard</a><div class="controls">${prevNext(t)}</div></div><header class="detail-head"><div class="between"><h1 id="detail-title" tabindex="-1"><span class="ticker">${esc(t)}</span> <span class="name">${esc(c.name)}</span></h1>${pill(c.overall)}</div><p>${rich(c.tag)}</p><p class="small muted">${group?esc(group[1]):`${esc(c.name)} ${esc(D.ui.text55)}`}</p><div class="detail-price">${money(s)} <small class="small muted">${dateLabel(s.date)}</small></div>${changes(s)}</header>${section('Daily quoted close',`<div class="controls" aria-label="Price chart range">${[3,6,12,24].map(m=>`<button type="button" data-detail-window="${m}" aria-pressed="${detailWindow===m}">${m===24?(s.bars<490?'Max':'2Y'):m===12?'1Y':m+'M'}</button>`).join('')}${c.kind==='biotech'?`<button type="button" id="overlay-benchmark" aria-pressed="${overlayBenchmark}">${esc(D.biotech_benchmark)} overlay</button>`:''}</div><p class="small muted">${esc(D.ui.text65)}</p><div id="detail-chart"></div><div class="axis-key"><span class="key-price">— Close</span><span class="key-50">— 50-day SMA</span><span class="key-200">— 200-day SMA</span>${c.kind==='biotech'?`<span class="key-bench">- - ${esc(D.biotech_benchmark)} (rebased)</span>`:''}</div><p class="small muted">${esc(D.ui.text52)}</p>${priceMetrics(t)}`)}${c.kind==='biotech'?biotechDetail(c):quantumDetail(c)}<div class="nav-row"><a href="#">← Back to dashboard</a><div class="controls">${prevNext(t)}</div></div>`;
  }
  function prevNext(t){
    const i=companies.findIndex(c=>c.t===t),prev=companies[(i+companies.length-1)%companies.length].t,next=companies[(i+1)%companies.length].t;
    return `<a href="#${esc(prev)}">← ${esc(prev)}</a><a href="#${esc(next)}">${esc(next)} →</a>`;
  }
  function priceChart(){
    const t=currentTicker,p=D.prices[t],c=byTicker[t],cutoff=detailWindow===24?p.rows[0][0]:monthStart(p.stats.date,detailWindow),rows=p.rows.map((r,i)=>({
      r,i
    })).filter(o=>o.r[0]>=cutoff);
    const series=[{
      cls:'price-line',pts:rows.map(o=>[dateMs(o.r[0]),o.r[1]])
    },{
      cls:'ma50',pts:rows.filter(o=>p.sma50[o.i]!=null).map(o=>[dateMs(o.r[0]),p.sma50[o.i]])
    },{
      cls:'ma200',pts:rows.filter(o=>p.sma200[o.i]!=null).map(o=>[dateMs(o.r[0]),p.sma200[o.i]])
    }
    ];
    if(overlayBenchmark&&c.kind==='biotech'){
      const b=D.prices[D.biotech_benchmark].rows.filter(r=>r[0]>=rows[0].r[0]),base=b[0][1];
      series.push({
        cls:'benchmark',pts:b.map(r=>[dateMs(r[0]),r[1]/base*rows[0].r[1]])
      });
    }
    const refs=[];
    for(const key of ['inval','repair'])if(typeof c[key]==='number'||/^\d+(?:\.\d+)?$/.test(c[key]||''))refs.push({
      label:key==='inval'?D.ui.text53:D.ui.text54,value:Number(c[key])
    });
    const values=series.flatMap(s=>s.pts.map(p=>p[1])).concat(refs.map(r=>r.value)),lo=Math.min(...values),hi=Math.max(...values),margin=(hi-lo||10)*.08,width=Math.max(320,Math.min(900,($('detail-chart').clientWidth||916)-16)),height=width<600?320:390,a=axes(width,height,[dateMs(rows[0].r[0]),dateMs(rows.at(-1).r[0])],[lo-margin,hi+margin]);
    chartContext={
      rows,a,width,height
    };
    crosshairIndex=Math.min(crosshairIndex??rows.length-1,rows.length-1);
    $('detail-chart').innerHTML=`<div class="chart-frame"><svg id="price-svg" tabindex="0" role="group" aria-label="Daily close chart; arrow keys move crosshair" aria-describedby="price-readout" viewBox="0 0 ${width} ${height}">${a.marks}<path class="spark-area" fill="var(--accent)" d="${linePath(series[0].pts,a.x,a.y)} L${a.x(series[0].pts.at(-1)[0])},${height-a.pad.b} L${a.x(series[0].pts[0][0])},${height-a.pad.b} Z"/><circle class="spark-dot" fill="var(--accent)" cx="${a.x(series[0].pts.at(-1)[0])}" cy="${a.y(series[0].pts.at(-1)[1])}" r="3.5"/>${refs.map(r=>`<line class="reference" fill="none" x1="${a.pad.l}" x2="${width-a.pad.r}" y1="${a.y(r.value)}" y2="${a.y(r.value)}"/><text class="reference-text" fill="var(--warning)" x="${a.pad.l+4}" y="${a.y(r.value)-5}">${r.label} ${fmt(r.value)}</text>`).join('')}${series.map(s=>`<path class="${s.cls}" fill="none" d="${linePath(s.pts,a.x,a.y)}"/>`).join('')}<g id="crosshair-marks"></g></svg><div id="price-readout" class="chart-readout" role="status" aria-live="polite"></div></div>`;
    updateCrosshair();
    $('price-svg').addEventListener('pointermove',e=>{
      const rect=e.currentTarget.getBoundingClientRect(),x=(e.clientX-rect.left)/rect.width*width;
      const time=dateMs(rows[0].r[0])+(x-a.pad.l)/(width-a.pad.l-a.pad.r)*(dateMs(rows.at(-1).r[0])-dateMs(rows[0].r[0]));
      let nearest=0;
      rows.forEach((o,i)=>{
        if(Math.abs(dateMs(o.r[0])-time)<Math.abs(dateMs(rows[nearest].r[0])-time))nearest=i;
      });
      crosshairIndex=nearest;
      updateCrosshair();
    });
    $('price-svg').addEventListener('keydown',e=>{
      if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;
      e.preventDefault();
      crosshairIndex=e.key==='Home'?0:e.key==='End'?rows.length-1:Math.max(0,Math.min(rows.length-1,crosshairIndex+(e.key==='ArrowLeft'?-1:1)));
      updateCrosshair();
    });
  }
  function updateCrosshair(){
    if(!chartContext||!$('crosshair-marks'))return;
    const {
      rows,a,height
    }
    =chartContext,row=rows[crosshairIndex].r,x=a.x(dateMs(row[0])),y=a.y(row[1]);
    $('crosshair-marks').innerHTML=`<line class="crosshair" fill="none" x1="${x}" x2="${x}" y1="${a.pad.t}" y2="${height-a.pad.b}"/><circle class="cross-dot" fill="var(--accent)" cx="${x}" cy="${y}" r="4"/>`;
    $('price-readout').textContent=`${dateLabel(row[0])} · close ${D.prices[currentTicker].stats.currency} ${fmt(row[1])}`;
  }
  function route(focus=false){
    if(!D)return;
    const token=location.hash.slice(1),valid=/^[A-Za-z0-9]+$/.test(token)&&Object.hasOwn(byTicker,token);
    currentTicker=valid?token:null;
    chartContext=null;
    crosshairIndex=null;
    $('content').innerHTML=valid?detail(token):dashboard();
    if(valid){
      priceChart();
      if(focus)$('detail-title').focus();
    }
    else{
      $('board-sort').value=sortMode;
      renderBoard();
      comparison();
      if(focus)$('dashboard-title').focus();
    }
    if(focus)window.scrollTo({
      top:0,behavior:'instant'
    });
  }
  function openDashboard(data){
    D=data;
    companies=[...D.tiers.flatMap(g=>g[3].map(t=>D.companies.find(c=>c.t===t))),D.biotech];
    byTicker=Object.fromEntries(companies.map(c=>[c.t,c]));
    comparisonHidden=new Set(D.benchmarks);
    $('unlocked').innerHTML=header();
    $('theme-select').value=document.documentElement.dataset.theme||'system';
    $('unlocked').hidden=false;
    $('lock-screen').hidden=true;
    route();
    $(currentTicker?'detail-title':'dashboard-title').focus();
  }
  function lock(){
    D=null;
    companies=[];
    byTicker={
    };
    currentTicker=null;
    chartContext=null;
    crosshairIndex=null;
    comparisonHidden.clear();
    comparisonFocus=null;
    $('unlocked').replaceChildren();
    $('unlocked').hidden=true;
    $('lock-screen').hidden=false;
    $('passphrase').value='';
    $('passphrase').type='password';
    $('show-passphrase').textContent='Show';
    $('show-passphrase').setAttribute('aria-pressed','false');
    $('passphrase').focus();
  }
  const decode64 = value => Uint8Array.from(atob(value),c=>c.charCodeAt(0));
  async function decrypt(passphrase){
    if(!window.isSecureContext || !globalThis.crypto?.subtle || typeof DecompressionStream==='undefined')throw new Error('Decrypt APIs unavailable');
    const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(passphrase),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({
      name:'PBKDF2',salt:decode64(envelope.salt),iterations:envelope.iterations,hash:'SHA-256'
    },material,{
      name:'AES-GCM',length:256
    },false,['decrypt']);
    let bytes;
    try{
      bytes=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode64(envelope.iv)},key,decode64(envelope.ciphertext));
    }catch(error){
      if(error.name==='OperationError')throw Object.assign(new Error('Authentication failed'),{name:'AuthenticationError'});
      throw error;
    }
    const uncompressed=envelope.gzip?await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer():bytes;
    return JSON.parse(new TextDecoder().decode(uncompressed));
  }
  $('show-passphrase').addEventListener('click',()=>{
    const show=$('passphrase').type==='password';
    $('passphrase').type=show?'text':'password';
    $('show-passphrase').textContent=show?'Hide':'Show';
    $('show-passphrase').setAttribute('aria-pressed',String(show));
  });
  $('unlock-form').addEventListener('submit',async e=>{
    e.preventDefault();
    const button=$('unlock-button');
    button.disabled=true;
    button.textContent='Unlocking…';
    $('unlock-message').hidden=true;
    try{
      const data=await decrypt($('passphrase').value);
      $('passphrase').value='';
      openDashboard(data);
    }
    catch(error){
      $('passphrase').value='';
      $('unlock-message').textContent=error.name==='AuthenticationError'?"That passphrase didn't unlock the dashboard. Check it and try again.":"This browser can't decrypt the dashboard here. Open the page from its claude.ai link in an up-to-date browser.";
      $('unlock-message').hidden=false;
      $('passphrase').focus();
    }
    finally{
      button.disabled=false;
      button.textContent='Unlock';
    }
  });
  document.addEventListener('click',e=>{
    const b=e.target.closest('button');
    if(!D||!b)return;
    if(b.id==='lock-button'){
      lock();
      return;
    }
    if(b.dataset.boardView){
      boardView=b.dataset.boardView;
      document.querySelectorAll('[data-board-view]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
      renderBoard();
    }
    if(b.dataset.riskTicker)riskRemark(b);
    if(b.dataset.comparisonWindow){
      comparisonWindow=Number(b.dataset.comparisonWindow);
      document.querySelectorAll('[data-comparison-window]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
      comparison();
    }
    if(b.dataset.seriesToggle){
      const t=b.dataset.seriesToggle;
      if(comparisonHidden.has(t))comparisonHidden.delete(t);
      else comparisonHidden.add(t);
      comparison();
      const replacement=[...document.querySelectorAll('[data-series-toggle]')].find(x=>x.dataset.seriesToggle===t);
      replacement?.focus();
    }
    if(b.dataset.detailWindow){
      detailWindow=Number(b.dataset.detailWindow);
      crosshairIndex=null;
      document.querySelectorAll('[data-detail-window]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
      priceChart();
    }
    if(b.id==='overlay-benchmark'){
      overlayBenchmark=!overlayBenchmark;
      b.setAttribute('aria-pressed',String(overlayBenchmark));
      priceChart();
    }
  });
  document.addEventListener('change',e=>{
    if(!D)return;
    if(e.target.id==='board-sort'){
      sortMode=e.target.value;
      renderBoard();
    }
    if(e.target.id==='theme-select'){
      if(e.target.value==='system')document.documentElement.removeAttribute('data-theme');
      else document.documentElement.dataset.theme=e.target.value;
    }
  });
  document.addEventListener('focusin',e=>{
    if(!D)return;
    const cell=e.target.closest('[data-risk-ticker]');
    if(cell)riskRemark(cell);
    const legend=e.target.closest('[data-highlight]');
    if(legend)highlightSeries(legend.dataset.highlight);
  });
  document.addEventListener('focusout',e=>{
    if(e.target.closest('[data-highlight]')&&!e.relatedTarget?.closest('[data-highlight]'))highlightSeries(null);
  });
  document.addEventListener('pointerover',e=>{
    const item=e.target.closest('[data-highlight], [data-series]');
    if(D&&item)highlightSeries(item.dataset.highlight||item.dataset.series);
  });
  document.addEventListener('pointerout',e=>{
    if(D&&e.target.closest('[data-highlight], [data-series]')&&!e.relatedTarget?.closest('[data-highlight], [data-series]'))highlightSeries(null);
  });
  window.addEventListener('hashchange',()=>route(true));
  // Plain mode exists only in the optional local review output, never the deliverable.
  if(envelope.plain){
    openDashboard(JSON.parse(new TextDecoder().decode(decode64(envelope.plain))));
  }
})();
</script>
